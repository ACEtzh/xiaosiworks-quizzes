<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WORKLIFE // 体质测试</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-color: #121315;
            --panel-bg: rgba(20, 22, 26, 0.85);
            --primary-blue: #2b4cff;
            --primary-blue-hover: #4d68ff;
            --accent-red: #ff2a2a;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border-color: #333;
            --font-main: 'Orbitron', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(43, 76, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(43, 76, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* HUD 边框装饰 */
        .hud-corner {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--primary-blue);
            opacity: 0.7;
        }
        .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .container {
            width: 100%;
            max-width: 760px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 32px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(43, 76, 255, 0.1);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            display: none; 
            animation: fadeIn 0.4s ease-out forwards;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 开始界面 */
        #start-screen {
            text-align: center;
            padding: 44px 20px;
        }

        .logo-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary-blue);
            margin: 0 auto 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 40px rgba(43, 76, 255, 0.4);
            border: 4px solid #1a1a1a;
            outline: 2px solid var(--accent-red);
        }

        .logo-triangle {
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 45px solid white;
            margin-bottom: 8px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: white;
        }

        .main-title {
            font-size: 28px;
            line-height: 1.4;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 10px var(--primary-blue), 0 0 20px rgba(43, 76, 255, 0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .sub-title {
            color: var(--accent-red);
            font-size: 16px;
            font-family: 'PingFang SC', sans-serif;
            letter-spacing: 4px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .start-btn {
            background: transparent;
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
            padding: 14px 42px;
            font-size: 18px;
            font-family: var(--font-main);
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        @media (hover: hover) {
            .start-btn:hover {
                background: var(--primary-blue);
                color: white;
                box-shadow: 0 0 20px var(--primary-blue);
            }
        }

        .start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px var(--primary-blue);
        }

        .disclaimer {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 32px;
            font-family: 'PingFang SC', sans-serif;
            letter-spacing: 1px;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        /* 答题界面 */
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            color: var(--primary-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        #progress-text {
            flex: 1;
            text-align: center;
        }

        .prev-btn {
            background: transparent;
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            padding: 5px 12px;
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .prev-btn.disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        @media (hover: hover) {
            .prev-btn:hover {
                background: var(--primary-blue);
                color: white;
            }
        }

        .question-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: bold;
            font-family: 'PingFang SC', sans-serif;
            min-height: 65px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-main);
            padding: 14px 18px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            font-family: 'PingFang SC', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            margin-right: 15px;
            transition: all 0.2s;
            z-index: 2;
        }

        .option-btn span {
            z-index: 2;
            transition: all 0.2s;
        }

        @media (hover: hover) {
            .option-btn:hover {
                border-color: var(--primary-blue);
                background: rgba(43, 76, 255, 0.1);
            }
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        /* 返回上一题时的高亮选中态 */
        .option-btn.selected {
            border-color: var(--primary-blue);
            background: rgba(43, 76, 255, 0.25);
        }
        .option-btn.selected::before {
            background: var(--primary-blue);
            box-shadow: 0 0 8px var(--primary-blue);
        }
        .option-btn.selected span {
            color: white;
        }

        /* 选中时的确认特效（扫描与充能蓝光） */
        .option-btn.selecting {
            border-color: white;
            background: rgba(43, 76, 255, 0.4);
            box-shadow: 0 0 15px var(--primary-blue), inset 0 0 10px var(--primary-blue);
            pointer-events: none;
        }

        .option-btn.selecting::before {
            background: white;
            box-shadow: 0 0 10px white;
            transform: scale(1.2);
        }

        .option-btn.selecting span {
            color: white;
            text-shadow: 0 0 5px white;
        }

        /* 扫描线动画 */
        .option-btn.selecting::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: scan 0.4s ease-out forwards;
            z-index: 1;
        }

        @keyframes scan {
            100% { left: 100%; }
        }

        /* 结果界面 */
        .result-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-title {
            font-size: 26px;
            color: var(--accent-red);
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 42px;
            font-weight: 900;
            color: var(--primary-blue);
            text-shadow: 0 0 15px rgba(43, 76, 255, 0.6);
        }

        .analysis-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 30px;
            font-family: 'PingFang SC', sans-serif;
            line-height: 1.8;
            font-size: 15px;
        }

        /* 数据表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .data-table th, .data-table td {
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
        }

        .data-table th {
            background: rgba(43, 76, 255, 0.1);
            color: var(--primary-blue);
            font-weight: bold;
        }

        .data-table td:last-child {
            text-align: right;
            color: var(--accent-red);
            font-weight: bold;
        }

        .progress-bar {
            height: 6px;
            background: #222;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 1s ease-out;
        }

        .restart-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            padding: 15px;
            font-size: 16px;
            font-family: var(--font-main);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        @media (hover: hover) {
            .restart-btn:hover {
                background: var(--primary-blue);
                color: white;
            }
        }
        
        .restart-btn:active {
            transform: scale(0.98);
        }

        /* ===== 移动端适配 ===== */

        /* 平板 / 大屏手机横屏（≤760px） */
        @media (max-width: 760px) {
            .panel { padding: 24px 18px; }
            .main-title { font-size: 26px; }
            .question-text { font-size: 17px; }
        }

        /* 手机（≤600px） */
        @media (max-width: 600px) {
            .container { padding: 12px; }
            .panel { padding: 20px 16px; }
            .question-text { font-size: 16px; min-height: 48px; }
            .option-btn { padding: 13px 14px; font-size: 14px; }
            .logo-circle { width: 128px; height: 128px; }
            .logo-text { font-size: 17px; }
            .logo-triangle { border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 32px solid white; }
            .main-title { font-size: 23px; }
            .sub-title { font-size: 12px; }
            .result-title { font-size: 22px; }
            .result-score { font-size: 34px; }
            .data-table th, .data-table td { padding: 8px; font-size: 12px; }
            .analysis-box { font-size: 13px; }
        }

        /* 手机竖屏（≤480px）：针对性优化 */
        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding: 12px 0 20px;
            }
            .container {
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
                padding-top: max(10px, env(safe-area-inset-top));
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }
            .panel { padding: 16px 14px; }
            #start-screen { padding: 34px 14px 28px; }
            .logo-circle { width: 104px; height: 104px; box-shadow: 0 0 30px rgba(43, 76, 255, 0.35); }
            .logo-text { font-size: 15px; letter-spacing: 1px; }
            .logo-triangle { border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid white; margin-bottom: 5px; }
            .main-title { font-size: 21px; letter-spacing: 1px; margin-bottom: 6px; }
            .sub-title { font-size: 11px; letter-spacing: 2px; margin-bottom: 28px; }
            .start-btn { width: 100%; padding: 14px 20px; font-size: 16px; letter-spacing: 2px; }
            .disclaimer { margin-top: 26px; font-size: 11px; }
            .quiz-header { font-size: 11px; letter-spacing: 1px; margin-bottom: 20px; }
            .prev-btn { padding: 4px 8px; font-size: 11px; }
            #progress-text { letter-spacing: 0; }
            .question-text { font-size: 16px; line-height: 1.65; min-height: 48px; margin-bottom: 24px; }
            .options { gap: 10px; }
            .option-btn { padding: 13px 14px; font-size: 14px; min-height: 48px; }
            .option-btn::before { width: 10px; height: 10px; margin-right: 11px; }
            .result-header { margin-bottom: 24px; }
            .result-title { font-size: 20px; }
            .result-score { font-size: 30px; }
            .data-table th, .data-table td { padding: 7px 5px; font-size: 11px; }
            .analysis-box { padding: 14px; font-size: 13px; line-height: 1.75; }
            .restart-btn { min-height: 48px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 开始界面 -->
        <div id="start-screen" class="panel active">
            <div class="hud-corner tl"></div>
            <div class="hud-corner tr"></div>
            <div class="hud-corner bl"></div>
            <div class="hud-corner br"></div>
            
            <div class="logo-circle">
                <div class="logo-triangle"></div>
                <div class="logo-text">WORKLIFE</div>
            </div>
            
            <!-- 核心标题放大 -->
            <h1 class="main-title">你的体质适合<br>上班还是创业？</h1>
            <p class="sub-title">// SIDE A // 核心体质检测协议</p>
            
            <button class="start-btn" onclick="startQuiz()">TAP TO START</button>
            
            <div class="disclaimer">
                * 本测试基于职业锚与成就动机理论简制。<br>
                * 数据结果仅供娱乐参考，切勿作为人生重大决策依据。
            </div>
        </div>

        <!-- 答题界面 -->
        <div id="quiz-screen" class="panel">
            <div class="hud-corner tl"></div>
            <div class="hud-corner tr"></div>
            <div class="hud-corner bl"></div>
            <div class="hud-corner br"></div>

            <div class="quiz-header">
                <button id="prev-btn" class="prev-btn disabled" onclick="prevQuestion()">＜ 上一题</button>
                <span id="progress-text">SYSTEM.LOAD // 01 / 20</span>
                <span>UID: 0403</span>
            </div>
            
            <div class="question-text" id="question-text">
                <!-- 题目渲染区 -->
            </div>
            
            <div class="options" id="options-container">
                <!-- 选项渲染区 -->
            </div>
        </div>

        <!-- 结果界面 -->
        <div id="result-screen" class="panel">
            <div class="hud-corner tl"></div>
            <div class="hud-corner tr"></div>
            <div class="hud-corner bl"></div>
            <div class="hud-corner br"></div>

            <div class="result-header">
                <h2 class="result-title" id="result-type">分析中...</h2>
                <div class="result-score" id="result-score">00</div>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">TOTAL SCORE / 100</p>
            </div>

            <table class="data-table" id="data-table">
                <!-- 表格渲染区 -->
            </table>

            <div class="analysis-box" id="analysis-text">
                <!-- 文案渲染区 -->
            </div>

            <button class="restart-btn" onclick="location.reload()">RESTART PROTOCOL</button>
        </div>
    </div>

    <script>
        // 题目数据（4个维度，各5题，共20题。包含正向和反向计分）
        const questions = [
            // 维度1：成就驱力 (正向：1,2,4,5 反向：3)
            { id: 1, dim: '成就驱力', text: '我喜欢设定极具挑战性的目标，并为之全力以赴。', reverse: false },
            { id: 2, dim: '成就驱力', text: '看到别人在行业内呼风唤雨，我内心充满了“我也要这样”的渴望。', reverse: false },
            { id: 3, dim: '成就驱力', text: '我从不觉得非要出人头地，平平淡淡才是真。', reverse: true },
            { id: 4, dim: '成就驱力', text: '即使没有加班费，为了把项目做到完美，我也愿意投入额外的时间。', reverse: false },
            { id: 5, dim: '成就驱力', text: '我经常思考如何创造更大的价值，而不是仅仅完成分配的任务。', reverse: false },

            // 维度2：风险耐受 (正向：6,7,8,10 反向：9)
            { id: 6, dim: '风险耐受', text: '如果有一个可能带来巨大回报但风险极高的机会，我愿意押注。', reverse: false },
            { id: 7, dim: '风险耐受', text: '面对未知的市场变化，我第一反应是兴奋而不是恐慌。', reverse: false },
            { id: 8, dim: '风险耐受', text: '我不怕失败，我觉得失败是获取经验最快的途径。', reverse: false },
            { id: 9, dim: '风险耐受', text: '我从不做没有百分之百把握的事情，哪怕收益再高。', reverse: true },
            { id: 10, dim: '风险耐受', text: '我能够承受连续几个月没有稳定收入的心理压力。', reverse: false },

            // 维度3：自主需求 (正向：11,13,14,15 反向：12)
            { id: 11, dim: '自主需求', text: '我非常讨厌被别人安排得明明白白，我喜欢自己掌控节奏。', reverse: false },
            { id: 12, dim: '自主需求', text: '我从不排斥听领导的指挥，按部就班让我觉得踏实。', reverse: true },
            { id: 13, dim: '自主需求', text: '如果现有的规则不合理，我宁愿跳出体系，自己制定规则。', reverse: false },
            { id: 14, dim: '自主需求', text: '我渴望拥有自己的团队，而不是在别人的平台上做一个螺丝钉。', reverse: false },
            { id: 15, dim: '自主需求', text: '我希望能决定事情的发展方向，而不是只负责执行。', reverse: false },

            // 维度4：安全锚点 (正向：16,17,19,20 反向：18)
            { id: 16, dim: '安全锚点', text: '五险一金、稳定的双休比高额的提成更让我感到安心。', reverse: false },
            { id: 17, dim: '安全锚点', text: '如果下个月收入可能归零，我会连续几天失眠焦虑。', reverse: false },
            { id: 18, dim: '安全锚点', text: '我从不看重所谓的“铁饭碗”，我觉得那是能力不足的避风港。', reverse: true },
            { id: 19, dim: '安全锚点', text: '我更喜欢有明确的晋升路线和绩效考核体系的工作环境。', reverse: false },
            { id: 20, dim: '安全锚点', text: '比起充满未知的广阔天地，我更愿意呆在熟悉的舒适圈里。', reverse: false },
        ];

        // 选项列表
        const optionsList = [
            { text: '非常符合', value: 5 },
            { text: '比较符合', value: 4 },
            { text: '一般', value: 3 },
            { text: '比较不符合', value: 2 },
            { text: '非常不符合', value: 1 },
        ];

        let currentQuestionIndex = 0;
        let totalScore = 0;
        // 记录每题答案，用于返回上一题时撤销分数与回显选中
        let userAnswers = [];
        let dimScores = {
            '成就驱力': 0,
            '风险耐受': 0,
            '自主需求': 0,
            '安全锚点': 0
        };

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');

        function startQuiz() {
            startScreen.classList.remove('active');
            quizScreen.classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            const q = questions[currentQuestionIndex];
            
            // 更新进度条文字
            const currentNum = (currentQuestionIndex + 1).toString().padStart(2, '0');
            progressText.innerText = `SYSTEM.LOAD // ${currentNum} / 20`;

            // 更新“上一题”按钮状态
            const prevBtn = document.getElementById('prev-btn');
            if (currentQuestionIndex === 0) {
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.classList.remove('disabled');
            }

            // 渲染题目
            questionText.innerText = q.text;

            // 渲染选项
            optionsContainer.innerHTML = '';
            const prevAnswer = userAnswers[currentQuestionIndex];
            optionsList.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (prevAnswer && prevAnswer.value === opt.value) {
                    btn.classList.add('selected');
                }
                btn.innerHTML = `<span>${opt.text}</span>`;
                
                // 添加点击互动逻辑
                btn.onclick = () => {
                    // 移除其他按钮的选中状态，并禁用所有按钮
                    document.querySelectorAll('.option-btn').forEach(b => {
                        b.style.pointerEvents = 'none';
                        b.classList.remove('selecting');
                    });
                    
                    // 添加选中确认特效（蓝色充能与扫描线）
                    btn.classList.add('selecting');
                    
                    // 延迟进入下一题，让特效展示完
                    setTimeout(() => {
                        selectOption(opt.value, q);
                    }, 350); 
                };
                
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(value, question) {
            // 处理反向计分逻辑
            let actualScore = question.reverse ? (6 - value) : value;

            // 如果这题之前答过，先减去旧分数，保证回改后总分正确
            if (userAnswers[currentQuestionIndex]) {
                const old = userAnswers[currentQuestionIndex];
                totalScore -= old.score;
                dimScores[old.dim] -= old.score;
            }

            userAnswers[currentQuestionIndex] = { dim: question.dim, score: actualScore, value: value };
            totalScore += actualScore;
            dimScores[question.dim] += actualScore;

            currentQuestionIndex++;
            renderQuestion();
        }

        // 返回上一题：撤销该题已计分数并清除记录，允许重新选择
        function prevQuestion() {
            if (currentQuestionIndex === 0) return;
            currentQuestionIndex--;
            // 保留该题已选记录用于高亮回显，分数在用户重新选择时自动重算
            renderQuestion();
        }

        function showResult() {
            quizScreen.classList.remove('active');
            resultScreen.classList.add('active');

            // 填充分数
            document.getElementById('result-score').innerText = totalScore;

            // 计算维度百分比用于表格展示 (每个维度满分25分)
            const dimMax = 25;
            
            // 渲染表格
            const table = document.getElementById('data-table');
            table.innerHTML = `
                <tr>
                    <th>维度指标 (DIMENSION)</th>
                    <th>数据走势 (DATA TREND)</th>
                    <th>得分 (SCORE)</th>
                </tr>
            `;

            for (const [key, value] of Object.entries(dimScores)) {
                const percent = (value / dimMax) * 100;
                table.innerHTML += `
                    <tr>
                        <td>${key}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percent}%; background: ${key === '安全锚点' ? 'var(--accent-red)' : 'var(--primary-blue)'}"></div>
                            </div>
                        </td>
                        <td>${value} / 25</td>
                    </tr>
                `;
            }

            // 分析文案匹配
            const typeEl = document.getElementById('result-type');
            const analysisEl = document.getElementById('analysis-text');

            if (totalScore >= 20 && totalScore <= 40) {
                // 极度创业者
                typeEl.innerText = "🔥 天生狂徒 (野兽模式)";
                analysisEl.innerHTML = `
                    <p style="color: var(--accent-red); font-weight: bold; margin-bottom: 10px;">>> 警告：检测到极高浓度肾上腺素。</p>
                    <p>你的骨子里流淌着不安分的血液。朝九晚五对你来说不是安稳，而是慢性自杀。你拥有极强的成就动机和抗风险能力，比起“安全”，你更渴望“赢”。</p>
                    <br>
                    <p><b>职业建议：</b>毫不犹豫地去创业吧！你适合做那个从0到1的破局者。不要委屈自己去大厂当螺丝钉，哪怕在街头摆摊，你也能折腾出一片天。但切记：找好你的“安全锚点”合伙人，别让冲动烧光了底牌。</p>
                `;
            } else if (totalScore >= 41 && totalScore <= 60) {
                // 自由职业/合伙人
                typeEl.innerText = "⚔️ 赛博游侠 (半人马模式)";
                analysisEl.innerHTML = `
                    <p style="color: var(--primary-blue); font-weight: bold; margin-bottom: 10px;">>> 系统提示：自由与秩序达成微妙平衡。</p>
                    <p>你是一个矛盾的结合体。你讨厌被死死管束，但又不想承担所有归零的风险。你有着不错的个人能力，偶尔也想折腾点什么，但理智总是拉住你的缰绳。</p>
                    <br>
                    <p><b>职业建议：</b>你是做“数字游民”、自由职业者或小团队合伙人的天选之子。你不适合传统的大企业，也扛不住重资产创业的毒打。去搞副业、接外包、做个人IP，或者加入初创公司做核心元老，这是让你最爽的姿势。</p>
                `;
            } else if (totalScore >= 61 && totalScore <= 80) {
                // 优质打工人
                typeEl.innerText = "🛠️ 高阶打工人 (义体人模式)";
                analysisEl.innerHTML = `
                    <p style="color: var(--text-main); font-weight: bold; margin-bottom: 10px;">>> 数据库匹配：大厂优质耗材 / 中流砥柱。</p>
                    <p>你拥有优秀的执行力，能在体系内如鱼得水。你渴望认可，也会为了升职加薪拼命，但你不愿意承担“下个月发不出工资”的风险。在你的潜意识里，有一份兜底的工资比画大饼重要得多。</p>
                    <br>
                    <p><b>职业建议：</b>老老实实去卷大厂、外企或者有一定规模的成熟公司吧。你的体质非常适合在严密的KPI体系下产出价值，通过晋升和跳槽来实现财富积累。别轻易去创业，员工的视角和老板的视角隔着一道天堑。</p>
                `;
            } else {
                // 究极求稳
                typeEl.innerText = "🛡️ 究极求稳型 (安全舱模式)";
                analysisEl.innerHTML = `
                    <p style="color: var(--accent-red); font-weight: bold; margin-bottom: 10px;">>> 网络连接：已进入绝对防御状态。</p>
                    <p>“稳定压倒一切”是你的座右铭。你对风险极其敏感，任何不确定的波动都会让你感到焦虑。你并不渴望成为什么改变世界的英雄，你只想要一份体面的收入、五险一金和按时下班的生活。</p>
                    <br>
                    <p><b>职业建议：</b>体制内、国企、事业单位或者大型传统企业的后台岗位是你最好的归宿。不要被网上“年薪百万”的焦虑洗脑。守住你的铁饭碗，下班后养猫种花、享受生活，这同样是一种了不起的清醒。</p>
                `;
            }
        }
    </script>
