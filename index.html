<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小斯特制 · 趣味测验</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        :root {
            --pink-light: #FFE4E1;
            --pink-main: #FFB6C1;
            --pink-dark: #FF69B4;
            --blue-main: #87CEEB;
            --green-main: #98FB98;
            --text-dark: #333;
            --box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--pink-light);
            background-image:
                linear-gradient(45deg, #ffd1dc 25%, transparent 25%, transparent 75%, #ffd1dc 75%, #ffd1dc),
                linear-gradient(45deg, #ffd1dc 25%, transparent 25%, transparent 75%, #ffd1dc 75%, #ffd1dc);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            color: var(--text-dark);
        }

        #app {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border: 4px solid var(--pink-main);
            border-radius: 16px;
            box-shadow: 6px 6px 0px var(--pink-dark), 0 5px 15px rgba(0,0,0,0.08);
            padding: 25px 20px;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: bold;
            color: var(--pink-dark);
            text-shadow: 1px 1px 0px #fff, 2px 2px 0px var(--pink-main);
            margin-bottom: 20px;
        }

        .logo svg { width: 30px; height: 30px; filter: drop-shadow(1px 1px 0px #fff); }

        h1 {
            text-align: center;
            color: var(--pink-dark);
            font-size: 28px;
            margin: 20px 0 10px;
            text-shadow: 2px 2px 0px #fff, 3px 3px 0px var(--pink-main);
        }

        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #777;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .quiz-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--pink-light);
            border: 3px solid var(--pink-main);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--box-shadow);
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.15s;
        }
        .quiz-card:active { transform: translateY(2px); box-shadow: none; }

        .quiz-icon {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            background: #fff;
            border: 2px solid var(--pink-main);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: inset 0 0 6px rgba(255,105,180,0.15);
        }

        .quiz-info { flex: 1; min-width: 0; }
        .quiz-name { font-size: 18px; color: var(--pink-dark); margin-bottom: 4px; }
        .quiz-desc { font-size: 13px; color: #888; line-height: 1.5; }
        .quiz-arrow { font-size: 18px; color: var(--pink-main); flex-shrink: 0; }

        .empty-tip {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            padding: 20px 0;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            margin-top: 22px;
            padding-top: 14px;
            border-top: 2px dashed var(--pink-light);
        }

        @media (max-width: 480px) {
            #app { border-width: 3px; padding: 18px 14px; }
            h1 { font-size: 24px; }
            .quiz-icon { width: 46px; height: 46px; font-size: 22px; }
            .quiz-name { font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="logo">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 35 40 L 48 10 L 60 35" />
                <path d="M 60 35 L 82 12 L 75 45" />
                <path d="M 50 35 C 15 35, 15 85, 50 85 C 85 85, 85 35, 50 35 Z" />
                <path d="M 50 38 C 75 38, 75 82, 50 82 C 25 82, 25 38, 50 38 Z" />
                <ellipse cx="50" cy="60" rx="5" ry="14" fill="#ffffff" />
            </g>
            <g fill="none" stroke="#666666" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 35 40 L 48 10 L 60 35" />
                <path d="M 60 35 L 82 12 L 75 45" />
                <path d="M 50 35 C 15 35, 15 85, 50 85 C 85 85, 85 35, 50 35 Z" />
                <path d="M 50 38 C 75 38, 75 82, 50 82 C 25 82, 25 38, 50 38 Z" />
                <ellipse cx="50" cy="60" rx="5" ry="14" fill="#666666" stroke="none" />
            </g>
        </svg>
        <span>小斯特制</span>
    </div>

    <h1>✨ 趣味测验站 ✨</h1>
    <p class="subtitle">轻松有趣的心理学小测验<br>测一测，更懂自己</p>

    <a class="quiz-card" href="love/q001-soulmate/">
        <div class="quiz-icon">💖</div>
        <div class="quiz-info">
            <div class="quiz-name">正缘类型测试</div>
            <div class="quiz-desc">36 道题，揭秘与你灵魂契合的那个 TA · 情感类</div>
        </div>
        <div class="quiz-arrow">▶</div>
    </a>

    <p class="empty-tip">更多测验制作中，敬请期待…</p>

    <div class="footer">小斯特制 · 趣味测验 · 结果仅供娱乐参考</div>
</div>

</body>
</html>
